<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONGraph - Schema Visualizer</title>
    <meta name="description"
        content="Analyze JSON objects to infer data schemas and visualize them as interactive directed graphs">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs/loader.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1c1c1f;
            --bg-elevated: #232326;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-default: rgba(255, 255, 255, 0.12);
            --text-primary: #fafafa;
            --text-secondary: #a1a1a6;
            --text-muted: #6b6b70;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --node-root: #f59e0b;
            --node-interface: #10b981;
            --node-property: #6366f1;
            --node-keys: #f59e0b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .pane {
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #input-pane {
            width: 400px;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .editor-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #editor-container {
            flex: 1;
            min-height: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--accent-primary);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-secondary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: none;
        }

        .editor-actions {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border-subtle);
        }

        #splitter {
            width: 4px;
            background: var(--bg-tertiary);
            cursor: col-resize;
            transition: background 0.2s;
        }

        #splitter:hover {
            background: var(--accent-primary);
        }

        #graph-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }

        #graph-area-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 100px;
            background: var(--bg-primary);
        }

        #graph-svg {
            width: 100%;
            height: 100%;
        }

        #gui-container {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 10;
        }

        #gui-container .lil-gui {
            --background-color: var(--bg-secondary);
            --text-color: var(--text-primary);
            --title-background-color: var(--bg-tertiary);
            --widget-color: var(--bg-elevated);
            --hover-color: var(--accent-primary);
            --focus-color: var(--accent-primary);
            --number-color: var(--accent-secondary);
            --string-color: var(--success);
        }

        #horizontal-splitter {
            height: 4px;
            background: var(--bg-tertiary);
            cursor: row-resize;
            transition: background 0.2s;
        }

        #horizontal-splitter:hover {
            background: var(--accent-primary);
        }

        #detail-view {
            background: var(--bg-secondary);
            padding: 1rem;
            height: 180px;
            min-height: 80px;
            overflow-y: auto;
            font-size: 0.875rem;
        }

        #detail-view h4 {
            margin: 0 0 0.75rem 0;
            font-size: 0.875rem;
            color: var(--accent-secondary);
        }

        #detail-view p {
            margin: 0.25rem 0;
            color: var(--text-secondary);
        }

        #detail-view strong {
            color: var(--text-primary);
        }

        #detail-view pre {
            background: var(--bg-tertiary);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            max-height: 80px;
            overflow-y: auto;
            color: var(--text-primary);
            margin: 0.5rem 0 0 0;
            border: 1px solid var(--border-subtle);
        }

        .empty-state {
            color: var(--text-muted);
            font-style: italic;
        }

        .node {
            cursor: grab;
            transition: filter 0.2s;
        }

        .node:hover {
            filter: brightness(1.2);
        }

        .node.selected {
            stroke: var(--accent-secondary) !important;
            stroke-width: 3px !important;
        }

        .node-group text {
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
            fill: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .link {
            stroke: var(--text-muted);
            stroke-opacity: 0.4;
        }

        .link-label {
            font-size: 10px;
            fill: var(--text-secondary);
            text-anchor: middle;
            dominant-baseline: central;
            font-family: 'JetBrains Mono', monospace;
        }

        .legend {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            display: flex;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--border-subtle);
            font-size: 0.75rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-default);
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🔗</span>
                <span class="logo-text">JSONGraph</span>
            </div>
            <span class="header-subtitle">Schema Visualizer</span>
        </header>
        <div class="container">
            <div id="input-pane" class="pane">
                <div class="editor-header">
                    <span class="editor-title">JSON Input</span>
                </div>
                <div id="editor-container"></div>
                <div class="editor-actions">
                    <button id="generate-graph" class="btn" style="width:100%">
                        <span>⚡</span>
                        <span>Generate Graph</span>
                    </button>
                </div>
            </div>
            <div id="splitter"></div>
            <div id="graph-pane" class="pane">
                <div id="graph-area-wrapper">
                    <div id="gui-container"></div>
                    <svg id="graph-svg"></svg>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--node-root)"></div>Root
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--node-interface)"></div>Interface
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--node-property)"></div>Property
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:var(--node-keys)"></div>Keys
                        </div>
                        <div class="legend-item"
                            style="border-left: 1px solid var(--border-default); padding-left: 1rem; margin-left: 0.5rem;">
                            <span style="opacity: 0.7">Double-click to unpin • Ctrl+Enter to generate</span>
                        </div>
                    </div>
                </div>
                <div id="horizontal-splitter"></div>
                <div id="detail-view"><span class="empty-state">Click a node to view details</span></div>
            </div>
        </div>
    </div>

    <script type="module">
        import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm';

        const inputDataExample = {
            "users": [
                { "id": 1, "name": "Alice", "email": "alice@example.com", "role": "admin" },
                { "id": 2, "name": "Bob", "email": "bob@example.com", "role": "user" }
            ],
            "settings": {
                "theme": "dark",
                "notifications": { "email": true, "push": false },
                "language": "en"
            },
            "metadata": {
                "version": "1.0.0",
                "lastUpdated": "2024-01-15"
            }
        };

        function getShapeKey(keysSet) { return Array.from(keysSet).sort().join(','); }

        function get_all_unique_shapes_recursive_js(data, shapes_set) {
            if (typeof data === 'object' && data !== null && !Array.isArray(data)) {
                const current_keys = Object.keys(data);
                if (current_keys.length > 0) shapes_set.add(new Set(current_keys));
                for (const value of Object.values(data)) get_all_unique_shapes_recursive_js(value, shapes_set);
            } else if (Array.isArray(data)) {
                for (const item of data) get_all_unique_shapes_recursive_js(item, shapes_set);
            }
        }

        function extract_interfaces_js(data) {
            const all_discovered_shapes_sets = new Set();
            if (typeof data === 'object' && data !== null && !Array.isArray(data) && Object.keys(data).length > 0) {
                all_discovered_shapes_sets.add(new Set(Object.keys(data)));
            }
            get_all_unique_shapes_recursive_js(data, all_discovered_shapes_sets);
            const all_discovered_shapes = Array.from(all_discovered_shapes_sets);
            let maximal_shapes = [];
            for (const s1 of all_discovered_shapes) {
                let is_maximal = true;
                for (const s2 of all_discovered_shapes) {
                    if (s1 === s2) continue;
                    let s1_is_subset_s2 = true;
                    for (const item of s1) { if (!s2.has(item)) { s1_is_subset_s2 = false; break; } }
                    if (s1_is_subset_s2 && s1.size < s2.size) { is_maximal = false; break; }
                }
                if (is_maximal) maximal_shapes.push(s1);
            }
            maximal_shapes.sort((fsA, fsB) => {
                const a = Array.from(fsA).sort().join(',');
                const b = Array.from(fsB).sort().join(',');
                return a.localeCompare(b);
            });
            const id_to_final_shape_map = {};
            const final_shape_to_id_map = new Map();
            maximal_shapes.forEach((shape_keys_set, i) => {
                const interface_id = `id_${i + 1}`;
                id_to_final_shape_map[interface_id] = shape_keys_set;
                final_shape_to_id_map.set(getShapeKey(shape_keys_set), interface_id);
            });
            const shape_to_final_id_map = new Map();
            for (const original_shape_set of all_discovered_shapes) {
                let best_fit_maximal_shape_set = null;
                let min_extra_keys = Infinity;
                for (const maximal_s_set of maximal_shapes) {
                    let is_subset = true;
                    for (const item of original_shape_set) { if (!maximal_s_set.has(item)) { is_subset = false; break; } }
                    if (is_subset) {
                        const extra_keys_count = maximal_s_set.size - original_shape_set.size;
                        if (extra_keys_count < min_extra_keys) {
                            min_extra_keys = extra_keys_count;
                            best_fit_maximal_shape_set = maximal_s_set;
                        } else if (extra_keys_count === min_extra_keys && best_fit_maximal_shape_set && getShapeKey(maximal_s_set) < getShapeKey(best_fit_maximal_shape_set)) {
                            best_fit_maximal_shape_set = maximal_s_set;
                        }
                    }
                }
                if (best_fit_maximal_shape_set) {
                    shape_to_final_id_map.set(getShapeKey(original_shape_set), final_shape_to_id_map.get(getShapeKey(best_fit_maximal_shape_set)));
                }
            }
            return { shape_to_final_id_map, id_to_final_shape_map };
        }

        function collect_all_distinct_values_js(data, shape_to_final_id_map, id_to_final_shape_map) {
            const all_values = {};
            for (const final_id in id_to_final_shape_map) {
                all_values[final_id] = {};
                for (const key of id_to_final_shape_map[final_id]) all_values[final_id][key] = new Set();
            }
            function _find_instances_and_collect(current_item) {
                if (typeof current_item === 'object' && current_item !== null && !Array.isArray(current_item)) {
                    const current_keys = Object.keys(current_item);
                    if (current_keys.length > 0) {
                        const current_shape_set = new Set(current_keys);
                        const final_interface_id = shape_to_final_id_map.get(getShapeKey(current_shape_set));
                        if (final_interface_id && all_values[final_interface_id]) {
                            for (const [field_key, field_value] of Object.entries(current_item)) {
                                if (all_values[final_interface_id].hasOwnProperty(field_key)) {
                                    if (typeof field_value !== 'object' || field_value === null) {
                                        all_values[final_interface_id][field_key].add(field_value);
                                    } else if (Array.isArray(field_value)) {
                                        let is_list_of_primitives = field_value.length === 0 || field_value.every(elem => typeof elem !== 'object' || elem === null);
                                        if (is_list_of_primitives) field_value.forEach(elem => all_values[final_interface_id][field_key].add(elem));
                                    }
                                }
                            }
                        }
                    }
                    for (const v_child of Object.values(current_item)) _find_instances_and_collect(v_child);
                } else if (Array.isArray(current_item)) {
                    for (const item_in_list of current_item) _find_instances_and_collect(item_in_list);
                }
            }
            _find_instances_and_collect(data);
            return all_values;
        }

        class GraphBuilderJS {
            constructor(shape_to_final_id_map, id_to_final_shape_map, all_collected_values, root_final_id_for_graph) {
                this.shape_to_final_id_map = shape_to_final_id_map;
                this.id_to_final_shape_map = id_to_final_shape_map;
                this.all_collected_values = all_collected_values;
                this.root_final_id_for_graph = root_final_id_for_graph;
                this.node_definitions = {};
                this.edge_definitions = [];
                this.defined_interfaces_recursion = new Set();
                this.defined_property_nodes_graph = new Set();
                this.defined_keys_nodes_graph = new Set();
                this.node_definitions["root"] = { "shape": "Mdiamond", "label": "root" };
                for (const interface_id_str in this.id_to_final_shape_map) {
                    if (interface_id_str === this.root_final_id_for_graph) continue;
                    this.node_definitions[interface_id_str] = { "shape": "box", "label": interface_id_str };
                }
            }
            build(current_data_item, current_item_graph_label, interface_id_for_current_item) {
                if (typeof current_data_item !== 'object' || current_data_item === null || Array.isArray(current_data_item)) return;
                if (current_item_graph_label.startsWith("id_") && this.defined_interfaces_recursion.has(current_item_graph_label)) return;
                if (current_item_graph_label.startsWith("id_")) this.defined_interfaces_recursion.add(current_item_graph_label);
                const effective_interface_id_for_values = interface_id_for_current_item;
                const grouped_complex_fields = {};
                const list_fields_to_interfaces = {};
                const primitive_or_value_fields_to_draw = [];
                for (const [key, value] of Object.entries(current_data_item)) {
                    let is_list_field_of_interfaces = false;
                    if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                        const value_keys = Object.keys(value);
                        if (value_keys.length === 0) { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: false }); continue; }
                        const value_shape_set = new Set(value_keys);
                        const target_final_interface_id = this.shape_to_final_id_map.get(getShapeKey(value_shape_set));
                        if (target_final_interface_id) {
                            if (!grouped_complex_fields[target_final_interface_id]) grouped_complex_fields[target_final_interface_id] = [];
                            grouped_complex_fields[target_final_interface_id].push(key);
                        } else { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: false }); }
                    } else if (Array.isArray(value)) {
                        if (value.length > 0) {
                            const first_element = value[0];
                            const is_homogeneous_dict_list = typeof first_element === 'object' && first_element !== null && !Array.isArray(first_element);
                            if (is_homogeneous_dict_list) {
                                const element_keys = Object.keys(first_element);
                                const element_shape_set = element_keys.length > 0 ? new Set(element_keys) : null;
                                const target_list_element_final_id = element_shape_set ? this.shape_to_final_id_map.get(getShapeKey(element_shape_set)) : null;
                                if (target_list_element_final_id) {
                                    is_list_field_of_interfaces = value.every((item, i) => i === 0 || (typeof item === 'object' && item !== null && !Array.isArray(item) && this.shape_to_final_id_map.get(getShapeKey(new Set(Object.keys(item)))) === target_list_element_final_id));
                                    if (is_list_field_of_interfaces) {
                                        if (!list_fields_to_interfaces[target_list_element_final_id]) list_fields_to_interfaces[target_list_element_final_id] = [];
                                        list_fields_to_interfaces[target_list_element_final_id].push(key);
                                    } else { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: true }); }
                                } else { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: true }); }
                            } else { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: true }); }
                        } else { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: true }); }
                    } else { primitive_or_value_fields_to_draw.push({ key, value, is_list_field: false }); }
                }
                for (const [target_id, field_keys_orig] of Object.entries(grouped_complex_fields)) {
                    const field_keys = [...field_keys_orig].sort();
                    const field_keys_identifier = getShapeKey(new Set(field_keys));
                    const keys_node_graph_id = `keysnode_${current_item_graph_label}_to_${target_id}_via_${field_keys_identifier}`;
                    if (!this.defined_keys_nodes_graph.has(keys_node_graph_id)) {
                        this.node_definitions[keys_node_graph_id] = { "label": field_keys.length === 1 ? field_keys[0] : `{${field_keys.length}}`, "shape": "circle", "representedKeys": field_keys, "nodeType": "keysNode" };
                        this.defined_keys_nodes_graph.add(keys_node_graph_id);
                    }
                    this.edge_definitions.push({ source: current_item_graph_label, target: keys_node_graph_id, attributes: { "label": "" } });
                    this.edge_definitions.push({ source: keys_node_graph_id, target: target_id, attributes: { "label": "" } });
                    this.build(current_data_item[field_keys[0]], target_id, target_id);
                }
                for (const [target_id, field_keys_for_list_orig] of Object.entries(list_fields_to_interfaces)) {
                    const field_keys_for_list = [...field_keys_for_list_orig].sort();
                    const field_keys_list_identifier = getShapeKey(new Set(field_keys_for_list));
                    const keys_node_graph_id_list = `keysnode_${current_item_graph_label}_to_${target_id}_via_${field_keys_list_identifier}_list`;
                    if (!this.defined_keys_nodes_graph.has(keys_node_graph_id_list)) {
                        this.node_definitions[keys_node_graph_id_list] = { "label": field_keys_for_list.length === 1 ? field_keys_for_list[0] + "[]" : `{${field_keys_for_list.length}}[]`, "shape": "circle", "representedKeys": field_keys_for_list, "nodeType": "keysNode" };
                        this.defined_keys_nodes_graph.add(keys_node_graph_id_list);
                    }
                    this.edge_definitions.push({ source: current_item_graph_label, target: keys_node_graph_id_list, attributes: { "label": "[]" } });
                    this.edge_definitions.push({ source: keys_node_graph_id_list, target: target_id, attributes: { "label": "" } });
                    if (current_data_item[field_keys_for_list[0]]?.length > 0) this.build(current_data_item[field_keys_for_list[0]][0], target_id, target_id);
                }
                for (const { key, value: value_data, is_list_field } of primitive_or_value_fields_to_draw) {
                    let distinct_values_for_prop_node = new Set();
                    if (effective_interface_id_for_values && this.all_collected_values[effective_interface_id_for_values]?.[key]) {
                        distinct_values_for_prop_node = this.all_collected_values[effective_interface_id_for_values][key];
                    }
                    const valnode_parent_id_str = effective_interface_id_for_values || "unknownparent";
                    const property_node_graph_id = `propnode_${valnode_parent_id_str}_${key}`;
                    if (!this.defined_property_nodes_graph.has(property_node_graph_id)) {
                        this.node_definitions[property_node_graph_id] = { "label": key, "shape": "circle", "primitiveValues": distinct_values_for_prop_node };
                        this.defined_property_nodes_graph.add(property_node_graph_id);
                    }
                    this.edge_definitions.push({ source: current_item_graph_label, target: property_node_graph_id, attributes: { "label": is_list_field ? "[]" : "" } });
                }
            }
            get_graph_components() { return { node_definitions: this.node_definitions, edge_definitions: this.edge_definitions }; }
        }

        let simulation = null;
        const svg = d3.select("#graph-svg");
        let link, node, edgeLabel;
        let selectedNodeData = null;
        const detailView = document.getElementById('detail-view');
        let id_to_final_shape_map_for_details = {};

        const guiSettings = { linkDistance: 120, linkStrength: 0.5, chargeStrength: -400, regenerate: () => processAndGenerateGraph() };
        const gui = new GUI({ autoPlace: false, width: 200 });
        document.getElementById('gui-container').appendChild(gui.domElement);
        gui.add(guiSettings, 'linkDistance', 30, 300, 5).name('Link Distance').onChange(updateSimulationForces);
        gui.add(guiSettings, 'linkStrength', 0.1, 2, 0.1).name('Link Strength').onChange(updateSimulationForces);
        gui.add(guiSettings, 'chargeStrength', -1000, -100, 20).name('Repulsion').onChange(updateSimulationForces);

        function getNodeColor(d) {
            if (d.id === 'root') return 'var(--node-root)';
            if (d.id.startsWith('id_')) return 'var(--node-interface)';
            if (d.id.startsWith('propnode_')) return 'var(--node-property)';
            if (d.id.startsWith('keysnode_')) return 'var(--node-keys)';
            return '#666';
        }

        function drawGraph(nodes_data, links_data) {
            svg.selectAll("*").remove();
            selectedNodeData = null;
            updateDetailView(null);
            const g = svg.append("g");
            const rect = svg.node().getBoundingClientRect();
            simulation = d3.forceSimulation(nodes_data)
                .force("link", d3.forceLink(links_data).id(d => d.id).distance(guiSettings.linkDistance).strength(guiSettings.linkStrength))
                .force("charge", d3.forceManyBody().strength(guiSettings.chargeStrength))
                .force("center", d3.forceCenter(rect.width / 2, rect.height / 2))
                .force("collision", d3.forceCollide().radius(30));

            link = g.append("g").selectAll("line").data(links_data).enter().append("line").attr("class", "link").attr("stroke-width", 1.5);
            edgeLabel = g.append("g").selectAll("text").data(links_data).enter().append("text").attr("class", "link-label").text(d => d.attributes.label);

            node = g.append("g").selectAll("g.node-group").data(nodes_data).enter().append("g").attr("class", "node-group")
                .on("click", function (event, d) {
                    event.stopPropagation();
                    selectedNodeData = d;
                    node.selectAll('.node').classed('selected', false);
                    d3.select(this).select('.node').classed('selected', true);
                    updateDetailView(d);
                })
                .call(drag(simulation));

            node.append(d => {
                if (d.shape === 'box') return document.createElementNS(d3.namespaces.svg, "rect");
                if (d.shape === 'Mdiamond') return document.createElementNS(d3.namespaces.svg, "polygon");
                return document.createElementNS(d3.namespaces.svg, "circle");
            })
                .attr("class", "node")
                .attr("r", d => d.shape === 'circle' ? (d.id.startsWith('keysnode_') ? 18 : 22) : null)
                .attr("width", d => d.shape === 'box' ? 70 : null)
                .attr("height", d => d.shape === 'box' ? 32 : null)
                .attr("rx", d => d.shape === 'box' ? 6 : null)
                .attr("points", d => d.shape === 'Mdiamond' ? "0,-22 22,0 0,22 -22,0" : null)
                .attr("fill", getNodeColor)
                .attr("stroke", "rgba(0,0,0,0.2)").attr("stroke-width", 2);

            node.append("text").text(d => d.label.length > 12 ? d.label.slice(0, 10) + '…' : d.label)
                .append("title").text(d => d.label); // Tooltip for full label

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                edgeLabel.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
                node.selectAll("rect").attr("x", -35).attr("y", -16);
            });

            const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => g.attr("transform", e.transform));
            svg.call(zoom);
            setupNodeUnpin();
            svg.on('click', function (event) {
                if (event.target === this || event.target.tagName === 'svg') { selectedNodeData = null; node.selectAll('.node').classed('selected', false); updateDetailView(null); }
            });
        }

        function drag(simulation) {
            return d3.drag()
                .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); });
        }

        // Double-click to unpin a node
        function setupNodeUnpin() {
            svg.on('dblclick', function (event) {
                const target = event.target;
                const nodeGroup = target.closest('.node-group');
                if (nodeGroup) {
                    const d = d3.select(nodeGroup).datum();
                    if (d) {
                        d.fx = null;
                        d.fy = null;
                        simulation.alpha(0.3).restart();
                    }
                }
            });
        }

        function updateSimulationForces() {
            if (!simulation) return;
            simulation.force("link").distance(guiSettings.linkDistance).strength(guiSettings.linkStrength);
            simulation.force("charge").strength(guiSettings.chargeStrength);
            simulation.alpha(0.3).restart();
        }

        function updateDetailView(data) {
            if (!data) { detailView.innerHTML = '<span class="empty-state">Click a node to view details</span>'; return; }
            let content = "";
            if (data.id === 'root') {
                content = `<h4>🌟 Root Node</h4><p>The entry point of your JSON structure</p>`;
            } else if (data.id.startsWith('id_')) {
                const fields = id_to_final_shape_map_for_details[data.id] ? Array.from(id_to_final_shape_map_for_details[data.id]).sort() : [];
                content = `<h4>📦 Interface: ${data.label}</h4><p><strong>Fields (${fields.length}):</strong></p><pre>${fields.join('\n') || 'No fields'}</pre>`;
            } else if (data.id.startsWith('propnode_')) {
                const values = data.primitiveValues?.size > 0 ? Array.from(data.primitiveValues).map(v => JSON.stringify(v)).sort() : [];
                content = `<h4>🔹 Property: ${data.label}</h4><p><strong>Distinct values (${values.length}):</strong></p><pre>${values.join('\n') || 'No values collected'}</pre>`;
            } else if (data.id.startsWith('keysnode_')) {
                const keys = data.representedKeys || [];
                content = `<h4>🔗 Field Group</h4><p><strong>Fields (${keys.length}):</strong></p><pre>${keys.join('\n')}</pre>`;
            }
            detailView.innerHTML = content;
        }

        function processAndGenerateGraph() {
            let input_data;
            try {
                if (!monacoEditorInstance) { alert("Editor not ready"); return; }
                const rawValue = monacoEditorInstance.getValue().trim();
                if (!rawValue) { alert("Please enter some JSON data"); return; }
                input_data = JSON.parse(rawValue);
            } catch (e) { alert("Invalid JSON: " + e.message); return; }

            // Handle primitive values at root level
            if (input_data === null || typeof input_data !== 'object') {
                alert(`Root value is a primitive (${input_data === null ? 'null' : typeof input_data}). Please provide an object or array.`);
                svg.selectAll("*").remove();
                return;
            }

            // Handle empty object or array
            if ((Array.isArray(input_data) && input_data.length === 0) ||
                (!Array.isArray(input_data) && Object.keys(input_data).length === 0)) {
                alert("Empty object or array. Please provide data with some structure.");
                svg.selectAll("*").remove();
                return;
            }

            // Wrap root-level arrays in an object for proper processing
            let wrappedData = input_data;
            let isRootArray = false;
            if (Array.isArray(input_data)) {
                wrappedData = { "items": input_data };
                isRootArray = true;
            }

            const { shape_to_final_id_map, id_to_final_shape_map } = extract_interfaces_js(wrappedData);
            id_to_final_shape_map_for_details = id_to_final_shape_map;
            const collected_primitive_vals = collect_all_distinct_values_js(wrappedData, shape_to_final_id_map, id_to_final_shape_map);

            let root_final_id_for_graph = null;
            if (typeof wrappedData === 'object' && wrappedData !== null && !Array.isArray(wrappedData) && Object.keys(wrappedData).length > 0) {
                root_final_id_for_graph = shape_to_final_id_map.get(getShapeKey(new Set(Object.keys(wrappedData))));
            }

            const builder = new GraphBuilderJS(shape_to_final_id_map, id_to_final_shape_map, collected_primitive_vals, root_final_id_for_graph);
            builder.build(wrappedData, "root", root_final_id_for_graph);
            let { node_definitions, edge_definitions } = builder.get_graph_components();

            // Update root label if we wrapped an array
            if (isRootArray && node_definitions["root"]) {
                node_definitions["root"].label = "root[]";
            }

            const all_interface_node_names = new Set(Object.keys(node_definitions).filter(n => n.startsWith("id_")));
            const in_degree = {}, out_degree = {};
            all_interface_node_names.forEach(n => { in_degree[n] = 0; out_degree[n] = 0; });

            for (const { source, target } of edge_definitions) {
                if (source === "root" && target.startsWith("id_") && in_degree[target] !== undefined) in_degree[target]++;
                if (source.startsWith("id_")) {
                    if (out_degree[source] !== undefined) out_degree[source]++;
                    if (target.startsWith("id_") && in_degree[target] !== undefined) in_degree[target]++;
                }
            }

            const interfaces_to_remove = new Set([...all_interface_node_names].filter(n => in_degree[n] === 0 && out_degree[n] === 0));
            const final_node_definitions_map = new Map();
            if (node_definitions["root"]) final_node_definitions_map.set("root", node_definitions["root"]);
            all_interface_node_names.forEach(n => { if (!interfaces_to_remove.has(n) && node_definitions[n]) final_node_definitions_map.set(n, node_definitions[n]); });

            const final_edge_definitions_list = edge_definitions.filter(({ source, target }) => {
                if (!final_node_definitions_map.has(source)) return false;
                if (target.startsWith("propnode_") || target.startsWith("keysnode_")) {
                    if (node_definitions[target]) { final_node_definitions_map.set(target, node_definitions[target]); return true; }
                }
                return final_node_definitions_map.has(target);
            });

            const d3_nodes = Array.from(final_node_definitions_map.entries()).map(([id, attrs]) => ({ id, ...attrs }));
            if (d3_nodes.length > 0) drawGraph(d3_nodes, final_edge_definitions_list);
            else { alert("No graphable data found."); svg.selectAll("*").remove(); }
        }

        let monacoEditorInstance;
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            monacoEditorInstance = monaco.editor.create(document.getElementById('editor-container'), {
                value: JSON.stringify(inputDataExample, null, 2),
                language: 'json', theme: 'vs-dark', automaticLayout: true,
                minimap: { enabled: false }, fontSize: 13, fontFamily: "'JetBrains Mono', monospace",
                scrollBeyondLastLine: false, padding: { top: 16 }
            });
            processAndGenerateGraph();
        });

        document.getElementById('generate-graph').addEventListener('click', processAndGenerateGraph);

        // Ctrl+Enter to generate graph
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                processAndGenerateGraph();
            }
        });

        // Splitter logic
        const splitter = document.getElementById('splitter');
        const inputPane = document.getElementById('input-pane');
        const container = document.querySelector('.container');
        let isDragging = false;

        splitter.addEventListener('mousedown', () => { isDragging = true; document.body.style.userSelect = 'none'; });
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const rect = container.getBoundingClientRect();
            let newWidth = Math.max(250, Math.min(e.clientX - rect.left, rect.width - 350));
            inputPane.style.width = newWidth + 'px';
        });
        document.addEventListener('mouseup', () => { isDragging = false; document.body.style.userSelect = ''; });

        // Horizontal splitter
        const hSplitter = document.getElementById('horizontal-splitter');
        const graphArea = document.getElementById('graph-area-wrapper');
        const detailPane = document.getElementById('detail-view');
        const graphPane = document.getElementById('graph-pane');
        let isHDragging = false;

        hSplitter.addEventListener('mousedown', e => { e.preventDefault(); isHDragging = true; document.body.style.userSelect = 'none'; });
        document.addEventListener('mousemove', e => {
            if (!isHDragging) return;
            const rect = graphPane.getBoundingClientRect();
            let newHeight = Math.max(100, Math.min(e.clientY - rect.top, rect.height - 80));
            graphArea.style.height = newHeight + 'px';
            graphArea.style.flex = 'none';
            detailPane.style.height = (rect.height - newHeight - 4) + 'px';
            detailPane.style.flex = 'none';
        });
        document.addEventListener('mouseup', () => { if (isHDragging && simulation) simulation.alpha(0.1).restart(); isHDragging = false; document.body.style.userSelect = ''; });
    </script>
</body>

</html>
